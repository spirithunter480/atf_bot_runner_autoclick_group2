# =============================================================================
# [تنظیم ۱]: نام نمایشی ورک‌فلو گروه دوم
# =============================================================================
name: ATF AutoClicker - Group 2

on:
  # اجرای دستی و تحریک از بیرون توسط کران‌جاب ۶ ساعته
  workflow_dispatch:

# =============================================================================
# [تنظیم ۲]: نام گروه قفل هم‌زمانی (متفاوت از گروه ۱)
# =============================================================================
concurrency:
  group: autoclicker-group-2
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot runner
        env:
          PYTHONUNBUFFERED: "1"
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        # =====================================================================
        # [تنظیم ۳]: نام فایل پایتون مربوط به این گروه
        # =====================================================================
        run: python bot_runner_autoclicker_group2.py
